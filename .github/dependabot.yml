version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /examples/go-wallet
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /examples/python-wallet
    # The ranges already admit new releases; only widen them when needed.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
