name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published against an unchanged lockfile surface.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory must not block unrelated pull requests;
    # the scheduled run and the job status still surface it.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
