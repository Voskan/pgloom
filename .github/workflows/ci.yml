name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported major version: the catalog queries, snapshot
        # restore and lock inspection differ between them.
        postgres: ["12", "13", "14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGLOOM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-features
      - name: Demo
        run: cargo run -q -p pgloom -- demo --color never --upstream "$PGLOOM_TEST_DATABASE_URL"

  msrv:
    name: msrv (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain is an input, not the action ref: Dependabot treats a
      # version-named ref as an action release and would "upgrade" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      # PostgreSQL-backed tests are skipped without PGLOOM_TEST_DATABASE_URL;
      # the point is that the declared rust-version builds and runs.
      - run: cargo test --locked --workspace --all-features

  example-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGLOOM_UPSTREAM_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: examples/go-wallet/go.sum
      - run: cargo build -q -p pgloom
      - name: The race is found
        working-directory: examples/go-wallet
        run: |
          set +e
          ../../target/debug/pgloom run --color never
          test $? -eq 1
      - name: The recorded schedule reproduces it
        working-directory: examples/go-wallet
        run: |
          set +e
          ../../target/debug/pgloom replay --color never
          test $? -eq 1
      - name: Both fixes pass
        working-directory: examples/go-wallet
        run: |
          WALLET_FIX=lock ../../target/debug/pgloom run --color never
          WALLET_FIX=atomic ../../target/debug/pgloom run --color never

  example-python:
    name: example-python (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported versions.
        python: ["3.9", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGLOOM_UPSTREAM_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: examples/python-wallet/requirements.txt
      - run: pip install -r examples/python-wallet/requirements.txt
      - run: cargo build -q -p pgloom
      # Run from the repository root: paths resolve against the scenario file.
      - name: The race is found
        run: |
          set +e
          ./target/debug/pgloom run examples/python-wallet/pgloom.yaml --color never
          test $? -eq 1
      - name: The recorded schedule reproduces it
        run: |
          set +e
          ./target/debug/pgloom replay --color never
          test $? -eq 1
      - name: Both fixes pass
        run: |
          WALLET_FIX=lock ./target/debug/pgloom run examples/python-wallet/pgloom.yaml --color never
          WALLET_FIX=atomic ./target/debug/pgloom run examples/python-wallet/pgloom.yaml --color never
