name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds and re-uploads the assets of an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag matches the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pgloom") | .version')
          test "v$version" = "$TAG" || {
            echo "tag $TAG does not match version $version" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p pgloom --target ${{ matrix.target }}
      # Each archive is published twice: under a versioned name, and under a
      # stable one that releases/latest/download/ always resolves.
      - name: Package
        shell: bash
        run: |
          dir="pgloom-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/pgloom" README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          cp "$dir.tar.gz" "pgloom-${TAG}-${{ matrix.target }}.tar.gz"
          for f in pgloom-*.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/pgloom --version
      - uses: actions/upload-artifact@v7
        with:
          name: pgloom-${{ matrix.target }}
          path: pgloom-*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pgloom-*
          merge-multiple: true
      # Idempotent: a release created by hand, or a re-run, gets its assets
      # replaced instead of failing on an existing release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat pgloom-*.sha256 > SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              pgloom-*.tar.gz SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --generate-notes \
              pgloom-*.tar.gz SHA256SUMS
          fi
