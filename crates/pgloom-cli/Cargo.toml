[package]
name = "pgloom"
description = "PgLoom: a deterministic interleaving model checker for PostgreSQL-backed services"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "pgloom_cli"
path = "src/lib.rs"

[[bin]]
name = "pgloom"
path = "src/main.rs"

[dependencies]
pgloom-wire.workspace = true
pgloom-pgctrl.workspace = true
pgloom-engine.workspace = true
pgloom-driver.workspace = true
pgloom-report.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pgloom-pgctrl = { workspace = true, features = ["testing"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
