[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Voskan/pgloom"
homepage = "https://github.com/Voskan/pgloom"
authors = ["Voskan Voskanyan"]
keywords = ["postgres", "race-condition", "model-checker", "testing", "concurrency"]
categories = ["development-tools::testing", "database"]

[workspace.dependencies]
pgloom-wire = { path = "crates/pgloom-wire", version = "0.1.0" }
pgloom-pgctrl = { path = "crates/pgloom-pgctrl", version = "0.1.0" }
pgloom-engine = { path = "crates/pgloom-engine", version = "0.1.0" }
pgloom-driver = { path = "crates/pgloom-driver", version = "0.1.0" }
pgloom-report = { path = "crates/pgloom-report", version = "0.1.0" }

anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.1"
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"

assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
